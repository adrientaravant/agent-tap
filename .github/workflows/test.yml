name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The proxy has no dependency. The suite runs against a fake API, so
      # there is nothing to install and no network call.
      - run: node --test test/proxy.test.mjs

  build-viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      # viewer/dist is committed so the tool runs with no build step. Fail if
      # it drifts from the source.
      - run: git diff --exit-code -- viewer/dist || (echo "viewer/dist is stale — run 'npm run build' in ui/ and commit" && exit 1)
